<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="你好，这里是 Kotorin. Computer Science / Software / AI / Homelab. WUHAN · UTC+8">
  <title>你好，这里是 Kotorin.</title>

  <!--
    Light 版封面。不是 dark 版的反色，是单独校准过的一版。
    颜色取自 miku-homepage 的 [data-theme='light']：
      bg #edf7f7 / primary #08131a / muted #5e7480
      brand #009ab4（亮底上用更深的青，避免过曝）/ secondary #39c5bb / accent #e3007f

    字号和画布高度跟 dark 版一起重新校准过（标题 64 / 副标题 22 / mono 15，
    画布 380），理由见 profile-dark.svg 的说明。文字坐标两版逐像素一致。

    右侧几何构图与 dark 版一致（背景三角形，见 profile-dark.svg 的说明）。
    描边颜色跟着主页走：color-brand-secondary 在亮色主题下翻成 #39c5bb。
    薄荷青画在浅底上本来就比深底弱，所以描边不透明度反而要比 dark 版调高一点，
    两版看上去才是同一个强度。
  -->

  <rect width="1200" height="380" fill="#edf7f7"/>

  <g fill="none" stroke="#39c5bb" stroke-width="1" stroke-opacity="0.7">
    <polygon points="1226,157 1173,209 1153,142"/>
    <polygon points="1204,30 1210,68 1176,56"/>
    <polygon points="1013,372 1025,315 1067,350"/>
    <polygon points="1081,213 1064,222 1064,204"/>
    <polygon points="952,172 983,176 966,199"/>
    <polygon points="921,259 900,258 911,241"/>
    <polygon points="844,90 862,70 870,93"/>
  </g>

  <!-- 整张图唯一的粉色：落在中间那个三角形的顶点上，当成一个节点标记。
       面积极小，浅底上不额外压暗，否则直接消失。 -->
  <circle cx="952" cy="172" r="2.5" fill="#e3007f" fill-opacity="0.6"/>

  <!-- 01：和左下那行 mono 共用基线，藏在同一条看不见的网格上 -->
  <text x="860" y="322"
    font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="13.5" letter-spacing="3" fill="#009ab4" opacity="0.34">01</text>

  <!--
    左侧主要信息。字体不做外部依赖，只给安全字体栈；
    Segoe UI / Helvetica Neue / PingFang SC 都有真正的细字重，
    落到 Arial 时会退成常规字重，这是可以接受的降级。
    青色只落在名字上，其余交给 primary 和 muted。
  -->
  <g font-family="Inter, 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif">
    <text x="64" y="132" font-size="64" font-weight="200" letter-spacing="1" fill="#5e7480">你好，</text>
    <text x="64" y="216" font-size="64" font-weight="200" letter-spacing="1" fill="#08131a">这里是 <tspan fill="#009ab4">Kotorin.</tspan></text>
    <text x="64" y="278" font-size="22" font-weight="400" letter-spacing="1.6" fill="#5e7480">Computer Science / Software / AI / Homelab</text>
  </g>

  <text x="64" y="322"
    font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="15" letter-spacing="2.4" fill="#009ab4">WUHAN &#183; UTC+8</text>
</svg>
