<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 720" width="700" height="720" role="img" aria-label="02 · ACTIVE / PRIVATE — Pocket Ame 口袋糖糖。如果用户没有发消息，她在干嘛？我不太想让答案永远是：WAITING_FOR_USER_MESSAGE。ACTIVITY / WORLD STATE / MEMORY / AUTONOMY · PRIVATE / 2026">
  <title>Pocket Ame 口袋糖糖</title>

  <!--
    项目页 02 手机版 Light。文字坐标和 mobile dark 逐像素一致，
    三角形少一个（去掉面积最小的那个），描边不透明度 0.7。
    WAITING_FOR_USER_MESSAGE 用 light 的 brand 青、不透明度 0.6，
    理由和桌面 light 版一样：亮底上 0.5 会淡到读不出来。
  -->

  <rect width="700" height="720" fill="#edf7f7"/>

  <g fill="none" stroke="#39c5bb" stroke-width="1.5" stroke-opacity="0.7">
    <polygon points="613,138 580,136 596,109"/>
    <polygon points="708,289 610,344 607,239"/>
    <polygon points="563,446 579,423 591,446"/>
  </g>

  <line x1="40" y1="72" x2="660" y2="72" stroke="#5e7480" stroke-width="1.5" stroke-opacity="0.2"/>

  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="20" letter-spacing="3.5">
    <text x="40" y="52" fill="#009ab4">02</text>
    <text x="660" y="52" text-anchor="end" fill="#5e7480" opacity="0.85">ACTIVE / PRIVATE</text>
  </g>

  <g font-family="Inter, 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif">
    <text x="80" y="170" font-size="48" font-weight="300" letter-spacing="1" fill="#08131a">Pocket Ame</text>
    <text x="80" y="228" font-size="48" font-weight="200" letter-spacing="3" fill="#5e7480">口袋糖糖</text>

    <g font-size="40" font-weight="300" fill="#08131a">
      <text x="80" y="350">如果用户没有发消息，</text>
      <text x="80" y="404">她在干嘛？</text>
    </g>

    <text x="80" y="478" font-size="30" font-weight="300" fill="#5e7480">我不太想让答案永远是：</text>
  </g>

  <text x="80" y="536"
    font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="26" letter-spacing="3" fill="#009ab4" opacity="0.6">WAITING_FOR_USER_MESSAGE</text>

  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="20" letter-spacing="3.5" fill="#5e7480" opacity="0.85">
    <text x="40" y="636">ACTIVITY / WORLD STATE</text>
    <text x="40" y="672">MEMORY / AUTONOMY</text>
    <text x="660" y="672" text-anchor="end" opacity="0.7">PRIVATE / 2026</text>
  </g>
</svg>
