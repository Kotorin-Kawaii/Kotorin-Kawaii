<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-label="MIKU · Linux · React · servers · VOCALOID · old computers · Homelab · networking · AI characters · audio · hardware* (* obviously not enough)。先这样，后面想到什么再改。KOTORIN / 2026 · STILL BUILDING">
  <title>先这样，后面想到什么再改。</title>

  <!--
    痕迹页 + 版权页 手机版 Light。文字坐标和 mobile dark 逐像素一致。
    三角形从 3 个减到 2 个（去掉面积最小的那个），描边不透明度 0.7，
    三根斜线的 alpha 提到 0.22：亮底上 0.16 基本看不见，
    而这三根线负责把散点串起来，不能消失。
  -->

  <rect width="700" height="700" fill="#edf7f7"/>

  <g fill="none" stroke="#39c5bb" stroke-width="1.5" stroke-opacity="0.7">
    <polygon points="680,183 689,244 634,225"/>
    <polygon points="625,371 567,375 589,325"/>
  </g>

  <g stroke="#39c5bb" stroke-width="1.5" stroke-opacity="0.22">
    <line x1="40" y1="196" x2="215" y2="166"/>
    <line x1="480" y1="300" x2="665" y2="258"/>
    <line x1="330" y1="502" x2="640" y2="528"/>
  </g>

  <g font-family="Inter, 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif">
    <text x="40" y="92" font-size="60" font-weight="200" letter-spacing="2" fill="#08131a">MIKU</text>
    <text x="240" y="210" font-size="60" font-weight="200" letter-spacing="1" fill="#08131a">servers</text>
    <text x="120" y="386" font-size="60" font-weight="200" letter-spacing="1" fill="#08131a">AI characters</text>

    <g font-size="36" font-weight="300" fill="#5e7480">
      <text x="330" y="92">Linux</text>
      <text x="40" y="326">Homelab</text>
      <text x="40" y="444">hardware*</text>
    </g>
  </g>

  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="20" letter-spacing="3.5" fill="#5e7480" opacity="0.85">
    <text x="160" y="150">React</text>
    <text x="40" y="268">VOCALOID</text>
    <text x="330" y="268">old computers</text>
    <text x="300" y="326">networking</text>
    <text x="520" y="444">audio</text>
  </g>

  <text x="40" y="492"
    font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="18" letter-spacing="1" fill="#5e7480" opacity="0.7">* obviously not enough</text>

  <line x1="40" y1="556" x2="660" y2="556" stroke="#5e7480" stroke-width="1.5" stroke-opacity="0.18"/>

  <text x="40" y="600"
    font-family="Inter, 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif"
    font-size="30" font-weight="300" fill="#5e7480">先这样，后面想到什么再改。</text>

  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="20" letter-spacing="3.5">
    <text x="40" y="646" fill="#009ab4" opacity="0.9">KOTORIN / 2026</text>
    <text x="660" y="646" text-anchor="end" fill="#5e7480" opacity="0.65">STILL BUILDING</text>
  </g>
</svg>
