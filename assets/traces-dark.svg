<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 704" width="1200" height="704" role="img" aria-label="MIKU · Linux · React · servers · VOCALOID · old computers · Homelab · networking · AI characters · audio · hardware* (* obviously not enough)。先这样，后面想到什么再改。KOTORIN / 2026 · STILL BUILDING">
  <title>先这样，后面想到什么再改。</title>

  <!--
    痕迹页 + 版权页。原来那块 code block 状态表整块换掉了，
    一出现等宽对齐的表格就是 neofetch 味。

    这里改成排版散点。防止它变成词云的两条规矩：
      1. 所有条目吸附到七条不可见基线上（88 / 152 / 196 / 266 / 330 / 400 / 460），
         横向也只用 x 64 / 232 / 396 / 520 / 560 / 760 / 880 这几列，
         看着散，其实全在网格上
      2. 层级只靠字号和字体区分，不随机：
         大号是标题字 weight 200，中号 weight 300，其余全是小号大写 mono
    三根极细的斜线把散点串起来，走的是字之间的空隙，不压任何字形。

    底部隔开一大段留白，横线以下当版权页收尾。
  -->

  <rect width="1200" height="704" fill="#08131a"/>

  <g fill="none" stroke="#009ab4" stroke-width="1" stroke-opacity="0.45">
    <polygon points="1091,204 1125,209 1106,236"/>
    <polygon points="991,471 1008,417 1045,454"/>
    <polygon points="875,129 861,133 864,120"/>
  </g>

  <g stroke="#009ab4" stroke-width="1" stroke-opacity="0.16">
    <line x1="64" y1="216" x2="330" y2="168"/>
    <line x1="620" y1="300" x2="1110" y2="232"/>
    <line x1="330" y1="470" x2="900" y2="520"/>
  </g>

  <g font-family="Inter, 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif">
    <text x="64" y="88" font-size="56" font-weight="200" letter-spacing="2" fill="#eafcff">MIKU</text>
    <text x="396" y="196" font-size="48" font-weight="200" letter-spacing="1" fill="#eafcff">servers</text>
    <text x="396" y="400" font-size="48" font-weight="200" letter-spacing="1" fill="#eafcff">AI characters</text>

    <g font-size="30" font-weight="300" fill="#8ca8b2">
      <text x="560" y="88">Linux</text>
      <text x="232" y="330">Homelab</text>
      <text x="64" y="460">hardware*</text>
    </g>
  </g>

  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="15" letter-spacing="4" fill="#8ca8b2" opacity="0.8">
    <text x="232" y="152">React</text>
    <text x="64" y="266">VOCALOID</text>
    <text x="760" y="266">old computers</text>
    <text x="520" y="330">networking</text>
    <text x="880" y="400">audio</text>
  </g>

  <text x="64" y="496"
    font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="13.5" letter-spacing="1" fill="#8ca8b2" opacity="0.55">* obviously not enough</text>

  <line x1="64" y1="566" x2="1136" y2="566" stroke="#8ca8b2" stroke-width="1" stroke-opacity="0.12"/>

  <text x="64" y="612"
    font-family="Inter, 'Helvetica Neue', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif"
    font-size="22" font-weight="300" fill="#8ca8b2">先这样，后面想到什么再改。</text>

  <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="15" letter-spacing="3">
    <text x="64" y="652" fill="#39c5bb" opacity="0.85">KOTORIN / 2026</text>
    <text x="1136" y="652" text-anchor="end" fill="#8ca8b2" opacity="0.6">STILL BUILDING</text>
  </g>
</svg>
